    <style>
      /* Bloquear e invisibilizar badge de Netlify y drawers inyectados */
      iframe[src*="netlify"],
      iframe[id*="netlify"],
      iframe[title*="netlify" i],
      #netlify-badge,
      [data-netlify-badge],
      .netlify-badge,
      div[id*="netlify" i],
      div[class*="netlify" i],
      body > iframe {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        position: absolute !important;
        top: -99999px !important;
        left: -99999px !important;
        width: 0 !important;
        height: 0 !important;
        z-index: -99999 !important;
      }
    </style>

  <body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-amber-200">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        function purgeNetlifyBadge() {
          var selectors = [
            'iframe[src*="netlify"]',
            'iframe[id*="netlify"]',
            'iframe[title*="netlify" i]',
            '#netlify-badge',
            '[data-netlify-badge]',
            '.netlify-badge',
            'div[id*="netlify" i]',
            'div[class*="netlify" i]'
          ];
          selectors.forEach(function(s) {
            try {
              document.querySelectorAll(s).forEach(function(el) { el.remove(); });
            } catch(e) {}
          });
          var root = document.getElementById('root');
          if (document.body) {
            var children = Array.from(document.body.children);
            children.forEach(function(child) {
              if (child !== root && child.tagName !== 'SCRIPT' && child.tagName !== 'STYLE' && child.tagName !== 'LINK') {
                if (child.tagName === 'IFRAME' || /netlify/i.test(child.id || '') || /netlify/i.test(child.className || '')) {
                  child.remove();
                }
              }
            });
          }
        }
        purgeNetlifyBadge();
        if (window.MutationObserver) {
          var observer = new MutationObserver(purgeNetlifyBadge);
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('DOMContentLoaded', purgeNetlifyBadge);
        window.addEventListener('load', purgeNetlifyBadge);
      })();
    </script>
    <script>
      // Optimización de orientación para tablet: detectar tablet y fijar apaisado (landscape)
      (function() {
        function enforceLandscapeOnTablet() {
          try {
            var minSide = Math.min(window.screen.width, window.screen.height);
            var isTablet = minSide >= 500 || /tablet|ipad|playbook|silk/i.test(navigator.userAgent);
            if (window.screen && window.screen.orientation) {
              if (isTablet && window.screen.orientation.lock) {
                window.screen.orientation.lock('landscape').catch(function() {
                  if (window.screen.orientation.unlock) window.screen.orientation.unlock();
                });
              } else if (window.screen.orientation.unlock) {
                window.screen.orientation.unlock();
              }
            }
          } catch(e) {}
        }
        enforceLandscapeOnTablet();
        window.addEventListener('DOMContentLoaded', enforceLandscapeOnTablet);
        window.addEventListener('load', enforceLandscapeOnTablet);
        window.addEventListener('pointerdown', enforceLandscapeOnTablet, { once: true });
        window.addEventListener('touchstart', enforceLandscapeOnTablet, { once: true });
        window.addEventListener('click', enforceLandscapeOnTablet, { once: true });
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=16').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.warn('Service worker registration failed:', err);
          });
        });
      }
    </script>
